[project]
name = "exploring-mcp"
version = "0.1.0"
description = "Learning MCP (Model Context Protocol) server development with Python and FastMCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sagar" }
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "black>=25.11.0",
    "fastmcp>=2.13.0.2",
    "httpx>=0.28.1",
    "notion-client>=2.7.0",
    "pygithub>=2.8.1",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "slack-sdk>=3.33.6",
    "uvicorn>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]